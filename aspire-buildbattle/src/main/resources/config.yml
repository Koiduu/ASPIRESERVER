# AspireBuildBattle Configuration

# Lobby countdown before game starts (seconds)
lobby-countdown: 60

# Minimum players required to start a game
min-players:
  solo: 2
  teams: 4
  pro-solo: 2
  pro-teams: 4

# Entity limits per plot
max-entities-per-plot: 5
max-heads-per-plot: 15

# Voting time per plot (seconds)
vote-time-per-plot: 15

# Countdown before building phase (seconds, after lobby countdown)
start-countdown: 3
