name: AspireBuildBattle
version: '1.0.0'
main: com.aspireserver.buildbattle.AspireBuildBattle
api-version: '1.21'
description: Build Battle competitive minigame
author: Aspire Team
depend: [AspireCore]
softdepend: [FastAsyncWorldEdit, WorldEdit, AxiomPaper]

commands:
  buildbattle:
    description: Build Battle main command
    usage: /buildbattle <join|leave|start|status>
  bb:
    description: Build Battle alias
    usage: /bb <join|leave|start|status>
  plotset:
    description: Set a plot for an arena
    usage: /plotset <arenaId>
    permission: aspire.buildbattle.admin
  spawnsetwaiting:
    description: Set the waiting lobby spawn (global)
    usage: /spawnsetwaiting
    permission: aspire.buildbattle.admin
  spawnwaiting:
    description: Set mode-specific waiting lobby
    usage: /spawnwaiting [solo|teams|pro]
    permission: aspire.buildbattle.admin
  togglesolo:
    description: Toggle plot creation to solo mode
    usage: /togglesolo
    permission: aspire.buildbattle.admin
  toggleteams:
    description: Toggle plot creation to teams mode
    usage: /toggleteams
    permission: aspire.buildbattle.admin
  togglepro:
    description: Toggle plot creation to pro mode
    usage: /togglepro
    permission: aspire.buildbattle.admin
  soloplot:
    description: Create/manage solo lobby arenas
    usage: /soloplot <number>
    permission: aspire.buildbattle.admin
  teamplot:
    description: Create/manage teams lobby arenas
    usage: /teamplot <number>
    permission: aspire.buildbattle.admin
  proplot:
    description: Create/manage pro lobby arenas
    usage: /proplot <number>
    permission: aspire.buildbattle.admin

permissions:
  aspire.buildbattle.admin:
    description: Admin access to Build Battle
    default: op
  aspire.buildbattle.worldedit:
    description: Use WorldEdit in pro modes
    default: false
