name: AspireBuildBattle
version: '1.0.0'
main: com.aspireserver.buildbattle.AspireBuildBattle
api-version: '1.21'
description: Build Battle competitive minigame
author: Aspire Team
depend: [AspireCore]
softdepend: [FastAsyncWorldEdit, WorldEdit, AxiomPaper]

commands:
  buildbattle:
    description: Build Battle main command
    usage: /buildbattle <join|leave|start|status>
  bb:
    description: Build Battle alias
    usage: /bb <join|leave|start|status>
  plotset:
    description: Set a plot for an arena
    usage: /plotset <arenaId>
    permission: aspire.buildbattle.admin
  spawnsetwaiting:
    description: Set the waiting lobby spawn
    usage: /spawnsetwaiting
    permission: aspire.buildbattle.admin

permissions:
  aspire.buildbattle.admin:
    description: Admin access to Build Battle
    default: op
  aspire.buildbattle.worldedit:
    description: Use WorldEdit in pro modes
    default: false
