name: AspireCreative
version: '26.2'
main: com.aspireserver.creative.AspireCreative
api-version: '1.21'
description: Creative plot world with tier system
author: Aspire Team
depend: [AspireCore]
softdepend: [FastAsyncWorldEdit, WorldEdit, AxiomPaper]
load: STARTUP

commands:
  plot:
    description: Creative plot commands
    usage: /plot <claim|home|visit|clear|dispose|add|remove|list|info>
    aliases: [p]
  creativeworld:
    description: Set creative world for a size tier
    usage: /creativeworld <small|medium|large> <worldName>
    permission: aspire.admin.creative

permissions:
  aspire.admin.creative:
    description: Creative admin commands
    default: op
  aspire.creative.plot:
    description: Use creative plot system
    default: true
  aspire.creative.large:
    description: Claim large plots
    default: op
  aspire.admin.bypass:
    description: Bypass all plot protections
    default: op
